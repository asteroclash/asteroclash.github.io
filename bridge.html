<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement Clash Royale...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            color: #1a73e8;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #5f6368;
            line-height: 1.5;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1.5rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .btn {
            display: inline-block;
            background: #34a853;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2d8e47;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #9aa0a6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Ouverture du profil...</h1>
        <p>Nous tentons d'ouvrir Clash Royale directement sur votre téléphone.</p>

        <a id="direct-link" href="#" class="btn">Ouvrir manuellement</a>

        <div class="footer">
            Si rien ne se passe, vous serez redirigé vers RoyaleAPI dans quelques secondes.
        </div>
    </div>

    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const tag = getQueryParam('tag');
        if (tag) {
            const cleanTag = tag.replace('#', '');
            const gameUrl = `clashroyale://playerInfo?id=${cleanTag}`;
            const fallbackUrl = `https://royaleapi.com/player/${cleanTag}`;

            document.getElementById('direct-link').href = gameUrl;

            // Tentative d'ouverture immédiate
            window.location.href = gameUrl;

            // Fallback vers RoyaleAPI après 3 secondes
            setTimeout(() => {
                window.location.href = fallbackUrl;
            }, 3000);
        } else {
            document.body.innerHTML = "<h1>Erreur</h1><p>Tag non spécifié.</p>";
        }
    </script>
</body>

</html>
